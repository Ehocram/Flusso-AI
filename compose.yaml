# Stack on-prem: PostgreSQL + applicazione (gunicorn) + reverse proxy Caddy.
# Pensato per esecuzione su rete interna / VPN. NON esporre su Internet.
# Compatibile con Docker Compose e con Podman (podman-compose / podman play).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iseo_ai}
      POSTGRES_USER: ${POSTGRES_USER:-iseo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definire POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iseo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?definire DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-flussoai.iseo.local}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://flussoai.iseo.local}
      POSTGRES_DB: ${POSTGRES_DB:-iseo_ai}
      POSTGRES_USER: ${POSTGRES_USER:-iseo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      SEED_DEMO: ${SEED_DEMO:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-flussoai.iseo.local}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  db_data:
  caddy_data:
  caddy_config:
